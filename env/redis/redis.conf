# Redis 持久化配置：保证“任一端重启后，已扣额度不丢、不增”
#
# AOF everysec：fsync 由后台线程每秒执行，崩溃最多丢约 1 秒内且尚未对外
# 放行的扣减；判定+扣减在同一 Lua 中原子落盘，不会出现扣了一半。
# 若可接受更高延迟，可改为 appendfsync always（每次写入都落盘）。
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 配额 key 绝不能被淘汰，否则已扣额度会“凭空消失/多出”
maxmemory-policy noeviction

# AOF 文件命名（Redis 7 多部分 AOF）由默认 manifest 管理
save 900 1
save 300 10
save 60 10000
