# Redis 持久化配置：保证“记额度那层重启后，已扣额度不丢、不增”
#
# appendfsync always：每次写入都 fsync 到磁盘后命令才算完成。
#   判定 + 扣减在同一个 Lua 中执行，脚本整体是一个写事件：
#     - Redis 崩溃发生在 fsync 前：该次调用还没成功返回，数据面会把它当作
#       失败（503/重试），不会有“已放行却没记账”；
#     - fsync 成功后崩溃：重启后该笔扣减一定还在，不会凭空多出额度。
#   代价是每次扣减多一次磁盘同步（通常 0.1~1ms，看磁盘）。若吞吐更重要，
#   可改回 everysec，代价是崩溃最多丢失约 1 秒内“尚未返回给调用方”的扣减。
appendonly yes
appendfsync always

# 关闭 RDB 快照：只保留 AOF 这一份事实来源，避免重启时旧 dump.rdb 与新 AOF
# 混用导致计数回退（凭空多额度）。
save ""

auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 配额 key 绝不能被淘汰，否则已扣额度会“凭空消失/多出”
maxmemory-policy noeviction
